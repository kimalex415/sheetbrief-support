name: Report a problem
description: Tell us what happened in Sheetbrief.
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Keep private data out of this public issue
      options:
        - label: I removed confidential spreadsheets, client information, credentials, and payment details.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a tiny fictional example if data is needed.
  - type: input
    id: version
    attributes:
      label: Sheetbrief and Chrome versions
